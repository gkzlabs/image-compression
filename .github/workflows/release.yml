# GitHub Actions Release for @gkzlabs/image-compression
#
# Publishes to npm with OIDC trusted publishing (no NPM_TOKEN secret needed)
# and creates a GitHub Release with auto-generated notes.
#
# Trigger: push of tag matching v*
# Workflow:
#   1. Full gate (lint + test + build) — same as prepublishOnly
#   2. npm publish with --provenance (signed by GitHub OIDC)
#   3. Create GitHub Release with notes from CHANGELOG + commits
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (e.g. v0.10.21)'
        required: true

# A tag push should never cancel — releases are critical
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm + GitHub Release
    runs-on: ubuntu-latest
    # 30 min, not 15: the publish verification polls the registry for up to 20 min
    # (npm processes publishes asynchronously — v1.4.0 took ~20 min to appear).
    timeout-minutes: 30
    # Only run on tag pushes from the default branch, or manual dispatch
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write         # create GitHub Release
      id-token: write         # OIDC for npm provenance
      attestations: write     # npm provenance attestation
    environment:
      name: npm-production
      url: https://www.npmjs.com/package/@gkzlabs/image-compression
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history for changelog

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Checkout tag (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: git checkout ${{ github.event.inputs.tag }}

      - name: Full pre-publish gate
        run: |
          npm ci --prefer-offline --no-audit
          npm run lint
          npm run typecheck:test
          npm test
          npm run build

      - name: Verify package version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION=${GITHUB_REF_NAME#v}
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi
          echo "Version match: $PKG_VERSION"

      - name: Publish to npm (with provenance, OIDC)
        # OIDC trusted publishing (per bump-version-and-release skill's
        # npm-oidc-publishing-pitfalls reference):
        #   - Do NOT set NODE_AUTH_TOKEN (empty '' blocks OIDC pickup; a real
        #     token overrides OIDC). setup-node + permissions.id-token inject
        #     the short-lived OIDC token automatically.
        #   - npm <= 10 (bundled with node 20) doesn't speak OIDC. Upgrade npm
        #     explicitly — node 22 tolerates npm@latest.
        #   - Requires a configured "trusted publisher" on npmjs pointing at
        #     gkzlabs/image-compression + release.yml (done at first OIDC
        #     publish, v0.10.23).
        #
        # Idempotent: if this exact version is already live on the registry
        # (e.g. tag re-pushed after a workflow fix), skip the publish — npm
        # rejects re-publishing the same version. The GitHub Release step below
        # still runs with the curated changelog.
        #
        # v1.4.0 — the publish is VERIFIED, because the CLI's success is not a live version.
        # Two registry behaviours make "green run, nothing published" possible:
        #   1. async processing — the registry answers "Your package is being processed and may
        #      take a few minutes to become available." and the version stays invisible to
        #      `npm view`, the mirrors and unpkg for ~20 minutes (measured on v1.4.0; it did
        #      publish correctly, just late);
        #   2. staged publishing (proof-of-presence, npm 12) — when the package access rule or
        #      the trust relationship requires it, the publish lands in the registry's staging
        #      area and stays invisible until a maintainer runs `npm stage approve <id>` (2FA).
        # So this step now polls the registry after publishing and fails loudly, quoting the
        # approve command when a stageId is present, instead of pretending success.
        run: |
          set -euo pipefail
          npm install -g npm@latest
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")

          if npm view "$PKG_NAME@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "Version $PKG_VERSION already published — skipping npm publish"
            exit 0
          fi

          # --json: a staged publish reports a stageId there (npm 12+).
          if ! npm publish --provenance --access public --json > /tmp/publish.json 2>/tmp/publish.err; then
            cat /tmp/publish.err >&2
            exit 1
          fi
          cat /tmp/publish.err >&2 || true

          # The registry can lag: npm answers "Your package is being processed and may take
          # a few minutes to become available." and the version only becomes visible later —
          # measured on v1.4.0: live ~20 minutes after the CLI reported success (invisible to
          # npm view, the mirrors, unpkg AND an owner-authenticated query in the meantime).
          # Poll with a generous budget before declaring failure.
          for i in $(seq 1 40); do
            if npm view "$PKG_NAME@$PKG_VERSION" version >/dev/null 2>&1; then
              echo "✓ verified live on the registry: $PKG_NAME@$PKG_VERSION (check #$i)"
              exit 0
            fi
            sleep 30
          done

          STAGE_ID=$(node -e "try{const j=JSON.parse(require('fs').readFileSync('/tmp/publish.json','utf8'));const r=Array.isArray(j)?j[0]:j;if(r&&r.stageId)process.stdout.write(String(r.stageId))}catch(e){}" || true)
          {
            echo "## ❌ npm publish did not go live"
            echo ""
            echo "\`$PKG_NAME@$PKG_VERSION\` is still not visible on the registry 20 minutes after the CLI reported success."
            if [ -n "${STAGE_ID:-}" ]; then
              echo ""
              echo "The publish was **staged** (proof-of-presence): stage id \`$STAGE_ID\`."
              echo "A maintainer must approve it with 2FA before anyone can install it:"
              echo '```bash'
              echo "npm login                              # refresh the token if it expired"
              echo "npm stage list $PKG_NAME"
              echo "npm stage approve $STAGE_ID"
              echo '```'
            else
              echo ""
              echo "No stage id was reported, so this looks like a stuck async processing state rather than"
              echo "staging. Check the registry again before re-tagging: \`npm view $PKG_NAME version\`."
            fi
            echo ""
            echo "To let this workflow publish directly next time, allow \`npm publish\` on the"
            echo "trust relationship (npmjs.com → package → Trusted Publisher) and/or set the"
            echo "package access rule so an OIDC publish is not redirected into staging."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::npm publish did not produce a live version — see the job summary for the approve command."
          exit 1

      - name: Extract changelog section for release notes
        id: changelog
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          # Extract the CHANGELOG.md section for this version (from "## [V]"
          # up to the next "## [" heading). Use index() for LITERAL match —
          # "[1.0.2]" as a regex would be a character class, not a literal.
          awk -v ver="[$VERSION]" '
            index($0, "## ") == 1 && index($0, ver) > 0 { capture=1; next }
            capture && index($0, "## ") == 1 { capture=0 }
            capture { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          if [ -s /tmp/release-notes.md ]; then
            echo "notes_found=true" >> "$GITHUB_OUTPUT"
          else
            echo "notes_found=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Release notes extracted ($(wc -l < /tmp/release-notes.md | tr -d ' ') lines)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          # Prefer the curated CHANGELOG.md section (features/fixes per
          # release); fall back to auto-generated notes when absent.
          body_path: /tmp/release-notes.md
          generate_release_notes: ${{ steps.changelog.outputs.notes_found != 'true' }}
          fail_on_unmatched_files: false