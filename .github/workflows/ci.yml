# GitHub Actions CI for @gkzlabs/image-compression
#
# The ONLY authoritative CI for this project (the GitLab pipeline in
# .gitlab-ci.yml is archived). Jobs: lockfile → lint → browser smoke → angular
# CLI build → CJS smoke → test → build → size.
# Triggers: push to main, pull_request, manual workflow_dispatch
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs for the same branch on new pushes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile-sync:
    # Guard against lockfile/package.json drift: regenerates the lockfile in a
    # clean copy and fails if it differs from what's committed. Catches both a
    # version bump that missed package-lock.json AND a dependabot lockfile that
    # is missing transitive deps — both break `npm ci` in every other job.
    name: Lockfile in sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify package-lock matches package.json
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff --exit-code package-lock.json \
            || { echo "✗ package-lock.json out of sync — run 'npm install' and commit it"; exit 1; }

  lint:
    name: Lint (tsc --noEmit)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - run: npm run lint

  browser-smoke:
    # Real Chromium against the BUILT bundle: forces each cascade path, checks
    # the __IC_WORKER_URL escape hatch, and asserts a worker URL that 404s makes
    # the cascade fall back instead of hanging. The unit suite runs on happy-dom
    # (+ @napi-rs/canvas), so it cannot cover Worker/OffscreenCanvas/WebCodecs
    # or `new URL('./worker.js', import.meta.url)` resolution at all — this job
    # is the only place a regression in those can be caught.
    name: Browser smoke (real Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - run: npm run build
      - name: Ensure Chrome is installed for Puppeteer
        run: npx puppeteer browsers install chrome
      - run: npm run test:browser
      - name: Deep worker verification (thread evidence + pixel checks)
        # Adds: real dedicated-worker targets, worker.js fetched 200, measured
        # main-thread gaps while compressing, pixel assertions for rotate/mirror
        # (incl. combined with maxSizeMB), worker reuse, and mid-flight dispose.
        run: npm run test:worker

  browser-matrix:
    # ข้อ 4: the Chromium-only job above never exercised the engines that behave
    # differently. Measured per engine (this repo, 2026-09-19):
    #   engine    WebCodecs  WebP encode  AVIF encode
    #   Chromium     yes         yes          yes
    #   Firefox      no*         yes          no
    #   WebKit       no          NO           yes
    # (*Firefox reports WebCodecs in some builds; the cascade must work either
    #  way, which is the point.) WebKit cannot encode WebP at all — canvas
    # silently returns PNG — so `canEncodeFormat()` and the <picture> helper have
    # to skip it rather than advertise a format the engine cannot produce.
    # Plays the same smoke page + harness as the Puppeteer suites.
    name: Browser matrix (${{ matrix.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    strategy:
      fail-fast: false
      matrix:
        engine: [firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - run: npm run build
      - name: Install Playwright browser (${{ matrix.engine }})
        run: npx --yes playwright@1.56.1 install --with-deps ${{ matrix.engine }}
      - name: Cross-engine browser matrix
        run: node test/browser-matrix.mjs ${{ matrix.engine }}

  angular-cli-build:
    # Angular CLI = the HOSTILE bundler (esbuild builder, node_modules imports).
    # This is the setup that previously 404'd on the worker URL. Build the real
    # CLI app AND drive it in a browser, so "Angular works" is proven, not assumed.
    name: Angular CLI example (hostile bundler)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build the library first (the example consumes file:../..)
        run: |
          npm ci --prefer-offline --no-audit
          npm run build
      - name: Install + build the Angular CLI example
        working-directory: examples/angular-cli
        run: |
          npm ci --prefer-offline --no-audit
          npm run build
      - name: Drive the built app in a real browser (asserts a Worker path)
        # Fails if Angular CLI stops emitting/copying the worker (the app would
        # silently degrade to canvas-main) or if compression throws.
        run: node test/angular-cli-e2e.mjs

  cjs-smoke:
    name: CJS bundle loads
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      # Build produces dist/index.cjs via esbuild (format: cjs).
      - run: npm run build
      # Guard: a CJS consumer (Node/SSR `require()`) must load the bundle.
      # A package.json exports/main regression (e.g. dropping the cjs file)
      # would fail here with MODULE_NOT_FOUND or a build error.
      - name: Smoke-test require('@gkzlabs/image-compression')
        run: node -e "const m=require('./dist/index.cjs'); if(typeof m.ImageCompression!=='function'){throw new Error('ImageCompression missing');} console.log('CJS OK, exports:', Object.keys(m).length)"

  test:
    name: Test (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - name: Type-check the specs
        # `npm run lint` uses tsconfig.json, which excludes **/*.spec.ts — so
        # type errors used to accumulate in the test files unnoticed (13 of them
        # when this step was added). Keep the specs type-clean too.
        run: npm run typecheck:test
      - run: npm run test:coverage
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 30
          # Fail loudly if coverage stops being produced (this step used to
          # upload an empty/missing directory because no coverage provider was
          # installed and `npm test` never passed --coverage).
          if-no-files-found: error

  build:
    name: Build (esbuild + tsc)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - run: npm run build
      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  size:
    name: Size (size-limit budget)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    continue-on-error: true   # size growth is informational, not a hard fail
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: npm ci --prefer-offline --no-audit
      - run: npm run size